name: Refresh data and deploy site

on:
  schedule:
    - cron: "0 11 * * *"      # every day 11:00 UTC (5:00 in Guadalajara); injuries and stats change daily in season
  workflow_dispatch:           # run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ["site/**", "src/**", ".github/workflows/deploy.yml"]

permissions:
  contents: write            # the daily run commits data/history (injury label history)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: node web_tests/core.test.js
      # Keep downloaded data between runs: finished seasons are skipped, so a daily run only fetches the current season.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      # The value model does not need play-by-play, so skip the big dataset.
      - run: ff-download --datasets player_stats snap_counts rosters_weekly injuries schedules players ff_opportunity team_stats pbp ngs_receiving ftn_charting
      - run: python -m ff.models.value
      # Sleeper only exposes the CURRENT injury label, so each run records the changes in data/history (see README).
      - name: Commit injury label history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          git diff --cached --quiet || { git commit -m "data: injury label history [skip ci]" && git pull --rebase && git push; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
