name: Refresh data and deploy site

on:
  schedule:
    - cron: "0 12 * * 2"      # Tuesdays 12:00 UTC, after Monday night football
  workflow_dispatch:           # run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ["site/**", "src/**", ".github/workflows/deploy.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: node web_tests/core.test.js
      # The value model does not need play-by-play, so skip the big dataset.
      - run: ff-download --datasets player_stats snap_counts rosters_weekly injuries schedules players ff_opportunity team_stats
      - run: python -m ff.models.value
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
